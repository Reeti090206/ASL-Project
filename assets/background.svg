<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ebf3fc" />
      <stop offset="45%" stop-color="#f5f9fd" />
      <stop offset="80%" stop-color="#edf4fc" />
      <stop offset="100%" stop-color="#e2eefb" />
    </linearGradient>

    <!-- Wave gradients -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bfdbfe" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#dbeafe" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.45" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#bfdbfe" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.35" />
    </linearGradient>

    <linearGradient id="cornerWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#bfdbfe" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Base background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)" />

  <!-- ========================================== -->
  <!-- 1. UPPER-LEFT NETWORK NODES & CONSTELLATION -->
  <!-- ========================================== -->
  <g id="network-nodes" opacity="0.65">
    <!-- Connecting Lines -->
    <line x1="60" y1="90" x2="140" y2="140" stroke="#93c5fd" stroke-width="1.2" stroke-opacity="0.5" />
    <line x1="140" y1="140" x2="220" y2="100" stroke="#93c5fd" stroke-width="1.2" stroke-opacity="0.5" />
    <line x1="140" y1="140" x2="170" y2="230" stroke="#93c5fd" stroke-width="1.2" stroke-opacity="0.5" />
    <line x1="220" y1="100" x2="310" y2="150" stroke="#93c5fd" stroke-width="1.2" stroke-opacity="0.4" />
    <line x1="220" y1="100" x2="280" y2="60" stroke="#93c5fd" stroke-width="1.2" stroke-opacity="0.4" />
    <line x1="170" y1="230" x2="250" y2="210" stroke="#93c5fd" stroke-width="1.2" stroke-opacity="0.5" />
    <line x1="250" y1="210" x2="310" y2="150" stroke="#93c5fd" stroke-width="1.2" stroke-opacity="0.5" />
    <line x1="310" y1="150" x2="390" y2="110" stroke="#93c5fd" stroke-width="1.2" stroke-opacity="0.35" />
    <line x1="310" y1="150" x2="360" y2="220" stroke="#93c5fd" stroke-width="1.2" stroke-opacity="0.35" />
    <line x1="250" y1="210" x2="360" y2="220" stroke="#93c5fd" stroke-width="1.2" stroke-opacity="0.35" />
    <line x1="390" y1="110" x2="470" y2="140" stroke="#93c5fd" stroke-width="1.2" stroke-opacity="0.3" />
    <line x1="360" y1="220" x2="440" y2="250" stroke="#93c5fd" stroke-width="1.2" stroke-opacity="0.3" />
    <line x1="170" y1="230" x2="110" y2="290" stroke="#93c5fd" stroke-width="1.2" stroke-opacity="0.4" />
    <line x1="110" y1="290" x2="190" y2="340" stroke="#93c5fd" stroke-width="1.2" stroke-opacity="0.35" />
    <line x1="190" y1="340" x2="270" y2="310" stroke="#93c5fd" stroke-width="1.2" stroke-opacity="0.35" />
    <line x1="250" y1="210" x2="270" y2="310" stroke="#93c5fd" stroke-width="1.2" stroke-opacity="0.35" />

    <!-- Node circles with halos -->
    <!-- Node 1 -->
    <circle cx="60" cy="90" r="10" fill="#bfdbfe" fill-opacity="0.25" />
    <circle cx="60" cy="90" r="4.5" fill="#3b82f6" fill-opacity="0.4" />
    <!-- Node 2 -->
    <circle cx="140" cy="140" r="14" fill="#bfdbfe" fill-opacity="0.3" />
    <circle cx="140" cy="140" r="6" fill="#2563eb" fill-opacity="0.45" />
    <!-- Node 3 -->
    <circle cx="220" cy="100" r="11" fill="#bfdbfe" fill-opacity="0.25" />
    <circle cx="220" cy="100" r="5" fill="#3b82f6" fill-opacity="0.4" />
    <!-- Node 4 -->
    <circle cx="280" cy="60" r="8" fill="#bfdbfe" fill-opacity="0.2" />
    <circle cx="280" cy="60" r="3.5" fill="#60a5fa" fill-opacity="0.4" />
    <!-- Node 5 -->
    <circle cx="170" cy="230" r="12" fill="#bfdbfe" fill-opacity="0.25" />
    <circle cx="170" cy="230" r="5.5" fill="#3b82f6" fill-opacity="0.45" />
    <!-- Node 6 -->
    <circle cx="250" cy="210" r="10" fill="#bfdbfe" fill-opacity="0.2" />
    <circle cx="250" cy="210" r="4.5" fill="#3b82f6" fill-opacity="0.4" />
    <!-- Node 7 -->
    <circle cx="310" cy="150" r="15" fill="#bfdbfe" fill-opacity="0.35" />
    <circle cx="310" cy="150" r="7" fill="#1d4ed8" fill-opacity="0.4" />
    <!-- Node 8 -->
    <circle cx="390" cy="110" r="9" fill="#bfdbfe" fill-opacity="0.2" />
    <circle cx="390" cy="110" r="4" fill="#60a5fa" fill-opacity="0.35" />
    <!-- Node 9 -->
    <circle cx="360" cy="220" r="11" fill="#bfdbfe" fill-opacity="0.2" />
    <circle cx="360" cy="220" r="5" fill="#3b82f6" fill-opacity="0.35" />
    <!-- Node 10 -->
    <circle cx="470" cy="140" r="8" fill="#bfdbfe" fill-opacity="0.15" />
    <circle cx="470" cy="140" r="3.5" fill="#60a5fa" fill-opacity="0.3" />
    <!-- Node 11 -->
    <circle cx="440" cy="250" r="8" fill="#bfdbfe" fill-opacity="0.15" />
    <circle cx="440" cy="250" r="3.5" fill="#60a5fa" fill-opacity="0.3" />
    <!-- Node 12 -->
    <circle cx="110" cy="290" r="9" fill="#bfdbfe" fill-opacity="0.2" />
    <circle cx="110" cy="290" r="4" fill="#60a5fa" fill-opacity="0.35" />
    <!-- Node 13 -->
    <circle cx="190" cy="340" r="10" fill="#bfdbfe" fill-opacity="0.2" />
    <circle cx="190" cy="340" r="4.5" fill="#3b82f6" fill-opacity="0.35" />
    <!-- Node 14 -->
    <circle cx="270" cy="310" r="8" fill="#bfdbfe" fill-opacity="0.15" />
    <circle cx="270" cy="310" r="3.5" fill="#60a5fa" fill-opacity="0.3" />
  </g>

  <!-- ========================================== -->
  <!-- 2. UPPER-RIGHT MEDIAPIPE HAND LANDMARKS     -->
  <!-- ========================================== -->
  <g id="mediapipe-hand" opacity="0.55" transform="translate(1480, 20)">
    <!-- Tracking Corner Reticles (Vision Bounding Box) -->
    <!-- Top-Left Bracket -->
    <path d="M 60,70 L 60,40 L 90,40" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.65" />
    <!-- Top-Right Bracket -->
    <path d="M 330,40 L 360,40 L 360,70" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.65" />
    <!-- Bottom-Left Bracket -->
    <path d="M 60,330 L 60,360 L 90,360" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.65" />
    <!-- Bottom-Right Bracket -->
    <path d="M 330,360 L 360,360 L 360,330" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.65" />

    <!-- Faint bounding frame border -->
    <rect x="60" y="40" width="300" height="320" fill="none" stroke="#93c5fd" stroke-width="1" stroke-dasharray="4,6" stroke-opacity="0.25" rx="8" />

    <!-- 21 Hand Landmarks & Bones -->
    <!-- Palm & Wrist Connections -->
    <g stroke="#3b82f6" stroke-width="1.8" stroke-opacity="0.45" stroke-linecap="round" stroke-linejoin="round">
      <!-- Wrist (0) to Thumb Base (1) & Fingers MCP (5, 9, 13, 17) -->
      <line x1="210" y1="330" x2="165" y2="275" /> <!-- 0 -> 1 -->
      <line x1="210" y1="330" x2="175" y2="205" /> <!-- 0 -> 5 -->
      <line x1="210" y1="330" x2="275" y2="230" /> <!-- 0 -> 17 -->
      
      <!-- Palm Knuckle Bridge -->
      <line x1="175" y1="205" x2="210" y2="195" /> <!-- 5 -> 9 -->
      <line x1="210" y1="195" x2="245" y2="205" /> <!-- 9 -> 13 -->
      <line x1="245" y1="205" x2="275" y2="230" /> <!-- 13 -> 17 -->
      <line x1="210" y1="330" x2="210" y2="195" stroke-opacity="0.25" stroke-dasharray="2,3" />
      <line x1="210" y1="330" x2="245" y2="205" stroke-opacity="0.25" stroke-dasharray="2,3" />

      <!-- Thumb: 1 -> 2 -> 3 -> 4 -->
      <line x1="165" y1="275" x2="135" y2="230" />
      <line x1="135" y1="230" x2="115" y2="190" />
      <line x1="115" y1="190" x2="95" y2="155" />

      <!-- Index Finger: 5 -> 6 -> 7 -> 8 -->
      <line x1="175" y1="205" x2="165" y2="145" />
      <line x1="165" y1="145" x2="160" y2="100" />
      <line x1="160" y1="100" x2="155" y2="55" />

      <!-- Middle Finger: 9 -> 10 -> 11 -> 12 -->
      <line x1="210" y1="195" x2="210" y2="130" />
      <line x1="210" y1="130" x2="210" y2="80" />
      <line x1="210" y1="80" x2="210" y2="35" />

      <!-- Ring Finger: 13 -> 14 -> 15 -> 16 -->
      <line x1="245" y1="205" x2="255" y2="145" />
      <line x1="255" y1="145" x2="265" y2="100" />
      <line x1="265" y1="100" x2="270" y2="55" />

      <!-- Pinky Finger: 17 -> 18 -> 19 -> 20 -->
      <line x1="275" y1="230" x2="295" y2="185" />
      <line x1="295" y1="185" x2="310" y2="145" />
      <line x1="310" y1="145" x2="320" y2="105" />
    </g>

    <!-- Keypoint Nodes (Dots) -->
    <!-- Point 0: Wrist -->
    <circle cx="210" cy="330" r="5" fill="#2563eb" fill-opacity="0.8" />
    <circle cx="210" cy="330" r="9" fill="#93c5fd" fill-opacity="0.3" />

    <!-- Thumb Points 1, 2, 3, 4 -->
    <circle cx="165" cy="275" r="4" fill="#3b82f6" fill-opacity="0.75" />
    <circle cx="135" cy="230" r="4" fill="#3b82f6" fill-opacity="0.75" />
    <circle cx="115" cy="190" r="4" fill="#3b82f6" fill-opacity="0.75" />
    <circle cx="95" cy="155" r="5" fill="#1d4ed8" fill-opacity="0.85" />
    <circle cx="95" cy="155" r="9" fill="#93c5fd" fill-opacity="0.3" />

    <!-- Index Points 5, 6, 7, 8 -->
    <circle cx="175" cy="205" r="4.5" fill="#2563eb" fill-opacity="0.8" />
    <circle cx="165" cy="145" r="4" fill="#3b82f6" fill-opacity="0.75" />
    <circle cx="160" cy="100" r="4" fill="#3b82f6" fill-opacity="0.75" />
    <circle cx="155" cy="55" r="5" fill="#1d4ed8" fill-opacity="0.85" />
    <circle cx="155" cy="55" r="9" fill="#93c5fd" fill-opacity="0.3" />

    <!-- Middle Points 9, 10, 11, 12 -->
    <circle cx="210" cy="195" r="4.5" fill="#2563eb" fill-opacity="0.8" />
    <circle cx="210" cy="130" r="4" fill="#3b82f6" fill-opacity="0.75" />
    <circle cx="210" cy="80" r="4" fill="#3b82f6" fill-opacity="0.75" />
    <circle cx="210" cy="35" r="5.5" fill="#1d4ed8" fill-opacity="0.9" />
    <circle cx="210" cy="35" r="10" fill="#93c5fd" fill-opacity="0.35" />

    <!-- Ring Points 13, 14, 15, 16 -->
    <circle cx="245" cy="205" r="4.5" fill="#2563eb" fill-opacity="0.8" />
    <circle cx="255" cy="145" r="4" fill="#3b82f6" fill-opacity="0.75" />
    <circle cx="265" cy="100" r="4" fill="#3b82f6" fill-opacity="0.75" />
    <circle cx="270" cy="55" r="5" fill="#1d4ed8" fill-opacity="0.85" />
    <circle cx="270" cy="55" r="9" fill="#93c5fd" fill-opacity="0.3" />

    <!-- Pinky Points 17, 18, 19, 20 -->
    <circle cx="275" cy="230" r="4" fill="#2563eb" fill-opacity="0.8" />
    <circle cx="295" cy="185" r="4" fill="#3b82f6" fill-opacity="0.75" />
    <circle cx="310" cy="145" r="4" fill="#3b82f6" fill-opacity="0.75" />
    <circle cx="320" cy="105" r="5" fill="#1d4ed8" fill-opacity="0.85" />
    <circle cx="320" cy="105" r="9" fill="#93c5fd" fill-opacity="0.3" />
  </g>

  <!-- ========================================== -->
  <!-- 3. SOFT FLOWING LIGHT-BLUE WAVES (BOTTOM)  -->
  <!-- ========================================== -->
  <g id="flowing-waves">
    <!-- Back Wave -->
    <path d="M 0,860 Q 300,800 650,870 T 1350,830 Q 1650,790 1920,840 L 1920,1080 L 0,1080 Z" fill="url(#waveGrad1)" />

    <!-- Middle Wave -->
    <path d="M 0,910 C 250,860 500,940 850,900 C 1200,860 1550,930 1920,890 L 1920,1080 L 0,1080 Z" fill="url(#waveGrad2)" />

    <!-- Bottom Foreground Accent Wave -->
    <path d="M 0,970 Q 400,920 800,980 T 1600,940 Q 1800,920 1920,950 L 1920,1080 L 0,1080 Z" fill="#bfdbfe" fill-opacity="0.3" />

    <!-- Bottom Left Subtle Corner Swirl -->
    <path d="M 0,760 Q 140,780 200,880 T 240,1080 L 0,1080 Z" fill="url(#cornerWave)" />
  </g>
</svg>
