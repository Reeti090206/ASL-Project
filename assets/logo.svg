<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Card gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Subtle drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1e40af" flood-opacity="0.25" />
    </filter>

    <!-- Inner glow -->
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
  </defs>

  <!-- Rounded Badge Container -->
  <rect x="18" y="18" width="164" height="164" rx="42" fill="url(#badgeGrad)" filter="url(#shadow)" />
  <rect x="20" y="20" width="160" height="160" rx="40" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" />

  <!-- Stylized ASL Hand Icon with MediaPipe Landmark Dots -->
  <g transform="translate(42, 38)">
    <!-- Palm & Fingers Silhouette -->
    <!-- Wrist Base -->
    <path d="M 46,112 C 46,112 52,122 58,122 C 64,122 70,112 70,112" fill="none" stroke="url(#handGrad)" stroke-width="5" stroke-linecap="round" />

    <!-- Palm outline -->
    <path d="M 32,82 C 32,102 46,116 58,116 C 70,116 84,102 84,82 L 84,52 C 84,48 80,44 76,44 C 72,44 68,48 68,52 L 68,34 C 68,30 64,26 60,26 C 56,26 52,30 52,34 L 52,24 C 52,20 48,16 44,16 C 40,16 36,20 36,24 L 36,54 C 36,50 32,46 28,46 C 24,46 20,50 20,54 L 20,70 C 14,70 8,76 10,84 C 12,94 24,96 32,92 Z" 
          fill="url(#handGrad)" fill-opacity="0.2" stroke="url(#handGrad)" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Keypoint Skeletal Links -->
    <g stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85">
      <!-- Wrist to MCP -->
      <line x1="58" y1="114" x2="36" y2="76" />
      <line x1="58" y1="114" x2="44" y2="70" />
      <line x1="58" y1="114" x2="60" y2="70" />
      <line x1="58" y1="114" x2="74" y2="76" />
      <line x1="58" y1="114" x2="20" y2="84" />

      <!-- Thumb (extended) -->
      <line x1="20" y1="84" x2="12" y2="76" />

      <!-- Index finger bones (extended upwards) -->
      <line x1="44" y1="70" x2="44" y2="44" />
      <line x1="44" y1="44" x2="44" y2="22" />

      <!-- Pinky finger bones (extended upwards - ASL 'I Love You' sign) -->
      <line x1="74" y1="76" x2="74" y2="52" />
      <line x1="74" y1="52" x2="74" y2="34" />
    </g>

    <!-- Landmark Points (MediaPipe Keypoint Nodes) -->
    <!-- Wrist -->
    <circle cx="58" cy="114" r="4.5" fill="#ffffff" />
    <circle cx="58" cy="114" r="8" fill="#93c5fd" fill-opacity="0.5" />

    <!-- Palm Knuckles -->
    <circle cx="20" cy="84" r="3.5" fill="#ffffff" />
    <circle cx="36" cy="76" r="3.5" fill="#ffffff" />
    <circle cx="44" cy="70" r="3.5" fill="#ffffff" />
    <circle cx="60" cy="70" r="3.5" fill="#ffffff" />
    <circle cx="74" cy="76" r="3.5" fill="#ffffff" />

    <!-- Thumb Tip -->
    <circle cx="12" cy="76" r="4" fill="#ffffff" />

    <!-- Index Finger Joints & Tip -->
    <circle cx="44" cy="44" r="3.5" fill="#ffffff" />
    <circle cx="44" cy="22" r="4.5" fill="#ffffff" />
    <circle cx="44" cy="22" r="8" fill="#93c5fd" fill-opacity="0.5" />

    <!-- Pinky Finger Joints & Tip -->
    <circle cx="74" cy="52" r="3.5" fill="#ffffff" />
    <circle cx="74" cy="34" r="4.5" fill="#ffffff" />
    <circle cx="74" cy="34" r="8" fill="#93c5fd" fill-opacity="0.5" />
  </g>
</svg>
