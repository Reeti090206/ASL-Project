<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Dark Workspace Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2227" />
      <stop offset="100%" stop-color="#15171a" />
    </linearGradient>

    <!-- Subtle Red Glow for Hand Landmark Keypoints -->
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ef4444" flood-opacity="0.6" />
    </filter>

    <!-- Drop Shadow for Badge -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Clean dark technical workspace badge -->
  <rect x="20" y="20" width="160" height="160" rx="10" fill="url(#badgeGrad)" stroke="#2c2f36" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Window controls accent dots: Red accented -->
  <circle cx="36" cy="36" r="3.5" fill="#ef4444" />
  <circle cx="48" cy="36" r="3.5" fill="#4b5563" />
  <circle cx="60" cy="36" r="3.5" fill="#374151" />

  <!-- Technical Hand Landmark Skeleton Wireframe in PURE RED ONLY -->
  <g transform="translate(42, 42)">
    <!-- Wrist Base in Pure Red -->
    <path d="M 46,112 C 46,112 52,120 58,120 C 64,120 70,112 70,112" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" />

    <!-- Palm outline in subtle red tint and dark boundary -->
    <path d="M 32,82 C 32,100 46,114 58,114 C 70,114 84,100 84,82 L 84,52 C 84,48 80,44 76,44 C 72,44 68,48 68,52 L 68,34 C 68,30 64,26 60,26 C 56,26 52,30 52,34 L 52,24 C 52,20 48,16 44,16 C 40,16 36,20 36,24 L 36,54 C 36,50 32,46 28,46 C 24,46 20,50 20,54 L 20,70 C 14,70 8,76 10,84 C 12,94 24,96 32,92 Z" 
          fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Landmark Skeletal Lines in Pure Red -->
    <g stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.95">
      <line x1="58" y1="114" x2="36" y2="76" />
      <line x1="58" y1="114" x2="44" y2="70" />
      <line x1="58" y1="114" x2="60" y2="70" />
      <line x1="58" y1="114" x2="74" y2="76" />
      <line x1="58" y1="114" x2="20" y2="84" />

      <!-- Thumb -->
      <line x1="20" y1="84" x2="12" y2="76" />

      <!-- Index Finger -->
      <line x1="44" y1="70" x2="44" y2="44" />
      <line x1="44" y1="44" x2="44" y2="22" />

      <!-- Pinky Finger (ASL Gesture) -->
      <line x1="74" y1="76" x2="74" y2="52" />
      <line x1="74" y1="52" x2="74" y2="34" />
    </g>

    <!-- Keypoint Nodes: Pure Red and Bright White Nodes -->
    <circle cx="58" cy="114" r="3.2" fill="#ffffff" stroke="#ef4444" stroke-width="1.5" />
    <circle cx="20" cy="84" r="2.6" fill="#ffffff" stroke="#ef4444" stroke-width="1" />
    <circle cx="36" cy="76" r="2.6" fill="#ffffff" stroke="#ef4444" stroke-width="1" />
    <circle cx="44" cy="70" r="2.6" fill="#ffffff" stroke="#ef4444" stroke-width="1" />
    <circle cx="60" cy="70" r="2.6" fill="#ffffff" stroke="#ef4444" stroke-width="1" />
    <circle cx="74" cy="76" r="2.6" fill="#ffffff" stroke="#ef4444" stroke-width="1" />
    <circle cx="12" cy="76" r="3.2" fill="#ef4444" filter="url(#redGlow)" />
    <circle cx="44" cy="44" r="2.6" fill="#ffffff" stroke="#ef4444" stroke-width="1" />
    <circle cx="44" cy="22" r="4.0" fill="#ef4444" filter="url(#redGlow)" />
    <circle cx="74" cy="52" r="2.6" fill="#ffffff" stroke="#ef4444" stroke-width="1" />
    <circle cx="74" cy="34" r="4.0" fill="#ef4444" filter="url(#redGlow)" />
  </g>
</svg>
